id: fabric-architecture-review
name: FAR
version: 2026.10.1
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
  data:
    enabled: false
  storage:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    assetAccess: protected
    buildCommand: npm run build:fabric
    indexDocument: index.html
  functions:
    enabled: false
