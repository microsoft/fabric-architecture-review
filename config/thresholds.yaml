# Threshold defaults for the architecture rules.
#
# WHERE TO CHANGE THEM
#   Fabric  Edit the values in the "<prefix>_Thresholds" Variable Library created by
#           setup (variable names are "<group>__<key>", e.g. architecture__monolith_max_items).
#           The same library holds the policy.yaml variables. Setup never overwrites values
#           you have changed.
#   Local   Edit this file.
#
# SCOPE
#   A value here applies to every workspace. Which workspaces are production and which
#   values are allowed are declared in policy.yaml.
#
# Only signals are tuned by ratios and counts; they suggest where to look and are never
# a failure. The one threshold that can affect the score is governance.min_admins (GOV-001).
#
# Thresholds marked "FUAM" are used only when FUAM is connected (config/sources.yaml). They
# are relative (a share of items, of capacity, of days) so they scale with the estate.
#
# Do not add keys: unknown or missing keys are rejected so a typo cannot silently
# change a review.

architecture:
  # ARCH-008. A workspace with more items than this is flagged for a responsibility review.
  # Example: 30 for a team that keeps workspaces small.
  monolith_max_items: 50
  # ARCH-009. Minimum share (0 to 1) of the workspace and its items that have a description.
  # Example: 0.8 expects four of every five artifacts to be documented.
  description_coverage_min_ratio: 0.5
  # ARCH-014. A workspace whose items depend on items in more than this many other
  # workspaces is flagged as tightly coupled. Example: 3.
  cross_workspace_dependency_max: 5

governance:
  # GOV-001. Minimum number of independent individual administrators per workspace.
  min_admins: 2
  # GOV-004. Regular expression the full name must match. Empty disables the comparison.
  # Example: "^(dev|test|prod)-[a-z]+-[a-z0-9-]+$"
  naming_pattern: ""
  # GOV-004. Minimum share (0 to 1) of names that must match naming_pattern.
  naming_coverage_min_ratio: 0.5
  # GOV-005. Minimum share (0 to 1) of a production workspace's semantic models that are
  # Promoted or Certified. Example: 0.8.
  endorsement_min_ratio: 0.5
  # GOV-006 (FUAM). Minimum share (0 to 1) of reviewed workspaces assigned to a domain.
  domain_coverage_min_ratio: 0.8
  # GOV-007 (FUAM). A workspace with no recorded activity for this many days is flagged.
  # FUAM must hold at least this much activity history, otherwise the result is missing evidence.
  inactive_workspace_days: 90
  # GOV-008 (FUAM). Items not modified for this many days count as stale.
  stale_item_days: 180
  # GOV-008 (FUAM). Flag a workspace when more than this share (0 to 1) of its items are stale.
  stale_item_max_ratio: 0.5

operations:
  # OPS-002 to OPS-004 (FUAM). Number of days of capacity metrics to look back.
  window_days: 30
  # OPS-002 (FUAM). Items with fewer operations in the window are not judged, to avoid noise.
  failure_min_events: 20
  # OPS-002 (FUAM). Flag items whose failed share of operations (0 to 1) exceeds this.
  failure_max_ratio: 0.2
  # OPS-003 (FUAM). Flag an item that uses more than this share (0 to 1) of its capacity's
  # compute (CU) in the window. Example: 0.25 means a quarter of the capacity.
  expensive_item_cu_max_ratio: 0.25
  # OPS-004 (FUAM). Flag a capacity that was throttled on more than this share (0 to 1) of
  # the days in the window.
  throttled_day_max_ratio: 0.1
  # OPS-005 (FUAM). Refreshes of an item in the window are judged only above this count, to avoid noise.
  refresh_min_events: 5
  # OPS-005 (FUAM). Flag items whose failed share of refreshes (0 to 1) exceeds this.
  refresh_failure_max_ratio: 0.2
  # OPS-007 (FUAM). Flag a workspace that uses more than this share (0 to 1) of its capacity's
  # compute (CU) in the window. Example: 0.5 means half the capacity.
  workspace_cu_max_ratio: 0.5
  # OPS-009. A capacity with fewer administrators than this is flagged, so one departure does not
  # leave it without anyone who can manage it.
  min_capacity_admins: 2
  # REL-001. Flag production when more than this share (0 to 1) of the declared production workspaces
  # run on one capacity. Example: 0.8 means more than four in five.
  capacity_concentration_max_ratio: 0.8

security:
  # SEC-009. More direct (non-group) principals than this is flagged; prefer groups.
  broad_access_max_principals: 10
  # SEC-012. Minimum share (0 to 1) of a production workspace's items that carry a
  # sensitivity label. Example: 0.8.
  label_min_ratio: 0.5
  # SEC-010. Dotted numeric version below which gateway members are flagged. Empty skips
  # the version floor. Example: "3000.250"
  gateway_min_version: ""
